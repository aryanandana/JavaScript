<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>even numbers</h4>
   <script>
    i=2
    do{
        document.write(i +"<br>")
        i+=2
    }
    while(i<=10);
   </script>
   <h4>odd numbers</h4>
   <script>
    i=1
    do{
        document.write(i+"<br>")
        i+= 2
    }
    while(i<=10)
   </script>
   <h4>array</h4> 
<script> 
  a =[4,6,8,10]
  for (i = 0; i <= 3; i++) 
  { 
    document.write(a[i] + "<br>"); 
  } 
</script>
<script>
a = [10,20,30,40,50]
b = []

j = 0

for(i=a.length-1; i>=0; i--)
{
    b[j] = a[i]
    j++
}

document.write(b)
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Operator</title>
</head>
<body>
    <script>
        let a=10,b=20 ,value
        value=a>b? a:b
        document.write("The largest number is:",value)
    </script>
    <script>document.write("<br>")</script>
    <script>
        let x=2,y=10,value1
        value1=x<y? x:y
        document.write("the smallest is:",value1)
    </script>
    <script>document.write("<br>")</script>
    <script>
        let v1=200,v2=100,v3=150,result
        result=(v1 > v2 && v1 > v3) ? v1 : (v2 > v3) ? v2 : v3;
        document.write("the largest is",result)
    </script>
    <script>document.write("<br>")</script>
    <script>
      let num1=99
      num1 %2 ==0 ? document.write("the number is even"): document.write("the number is odd")
    </script>
</body>
</html>

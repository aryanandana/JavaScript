<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch</title>
</head>
<body>
    <script>
let x=5
switch(x){
    case 1:
        document.write("one")
        break
    case 2:
        document.write("two")
        break
    case 3:
        document.write("three")
        break
    case 4:
        document.write("four")
        break
    case 5:
        document.write("five")
        break
    default:
        document.write("not")

}
</script>
<script>document.write("<h1>task</h1>")</script>
<script>
    let a = 20
    let b = 10
    let operation = "*"; 

    switch(operation) {
        case "+":
            document.write(a + b);
            break; 
        case "-":
            document.write(a-b)
            break
        case "*":
            document.write(a*b)
            break
        default:
            document.write("Not")
            break
    }
</script>
<script>document.write("<h1>odd or even</h1>")</script>
<script>
let number=10
    switch(number %2 ==0){
        case true:
        document.write("number is even ")
        break
        case false:
            document.write("number is odd")
            break
        default:
            document.write("not a number")
            break
        
    }




</script>
</body>
</html>

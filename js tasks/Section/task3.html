<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mark</title>
</head>
<body>
    <script>
        let student={
            name:"Arya",
            maths:80,
            physics:67,
            social:76,
            it:56,
            history:76
        }
        let total=student.maths+student.physics+student.social+student.it+student.history
        let average=total / 5
        console.log("Student Name:" +student.name)
        console.log("*********")
        console.log("Student Mark in all subjects")
        console.log("Maths:" +student.maths)
        console.log("Physics:" +student.physics)
        console.log("Social:" +student.social)
        console.log("IT:" +student.it)
        console.log("History:" +student.history)
        console.log("************")
        console.log("Student Total:" +total)
        console.log("Student Average Mark:"+average)
    </script>
</body>
</html>

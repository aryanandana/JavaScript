<body>
    <h4>1</h4>
    <script>
        i=10
        sum=0
        n=0
        while(i<=50)
        {
            document.write(i+ " ")
            sum=sum+i
             i++
             n++
        }  
        document.write("<br>"+"sum:" + sum)
        avg=sum/n
        document.write("<br>"+"average:"+avg)
    </script>

     <script>

    <h4>4</h4>
    <script>
    str="malayalam"
    reverse=""
    i=str.length-1
     while(i>=0){
        reverse = reverse + str[i]
        i--
     }
    if(str == reverse){
        document.write("Palindrome")
    }
    else{
        document.write("Not a palindrome")
    }
    </script>
    <h4>5</h4>
    <script>
        num=1234
        reverse=0
        while(num>0){
            r=num%10
            reverse=(reverse*10)+r
            num=Math.floor(num/10)  
        }
        document.write(reverse)        
    </script>

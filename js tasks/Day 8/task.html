    <h3>2</h3>
    <input type="text" placeholder="Enter weight (kg)" id="w">
    <br><br>
    <input type="text" placeholder="Enter height (cm)" id="h">
    <br><br>
    <input type="button" value="Calculate BMI" onclick="bmi()">
<p id="result"></p>
<script>
    function bmi(){
        wt = Number(document.getElementById("w").value)
        ht = Number(document.getElementById("h").value)

        ht = ht / 100
        b = wt / (ht * ht)

        if(b < 18.5){
            category = "Underweight"
        }
        else if(b < 25){
            category = "Normal"
        }
        else if(b < 30){
            category = "Overweight"
        }
        else{
            category = "Obese"
        }

        document.getElementById("result").innerHTML = "BMI: " +Math.floor(b) + "<br>Category: " + category
    }
</script>
<h3>3</h3>
<input type="text" id="v1" placeholder="enter a number">
<input type="text" id="op" placeholder="enter a operator">
<input type="text" id="v2" placeholder="enter a number">

<button onclick="operation()">Result</button>
<P id="display"></P>
<script>
    try{
        function operation()
        {
         n1 =Number(document.getElementById("v1").value)
         n2= Number(document.getElementById("v2").value)
         op= document.getElementById("op").value
        switch(op)
        {
            case "+":  
                Result=n1+n2
                break
            case "-":
                    Result=n1-n2
                    break
            case "*":
                Result=n1*n2
                break
            case "/":
                Result=n1/n2
                break  
            }
        document.getElementById("display").innerHTML = Result
        }
        
        
        }
    catch (error){
        console.log(error)
    }
    
</script>

<p id="R"></p>
<script>
    pi = 3.14
    try{
    function calculation(){
        r = Number(document.getElementById("radius").value)

        area = pi * (r*r)

    }
    }

        console.log(error)
    }
</script>

<button onclick="billtotal()">Bill</button>
<p id="total"></p>
<script>
    Total=0
    try{
    function billtotal(){
        price=Number(document.getElementById("price").value)
        quantity=Number(document.getElementById("quantity").value)
        Total=price * quantity
        if(Total>5000){
            discount=Total * (10/100)
            finalamount=Total-discount
            document.getElementById("total").innerHTML="Discount: " + discount + "<br>" + "Total Amount: " + finalamount
        }
        else{
            document.getElementById("total").innerHTML="Total Amount: " + Total
        }
    }
    }
    catch (error){
        console.log(error)
    }
</script>

<script>
       try{

           function atmoperation(){
            balance=Number(document.getElementById("balance").value)

    <h4>1</h4>
    <script>
    a = [[],[],[]]
    for(i=0;i<3;i++){
        document.write("<br>")
        for(j=0;j<=i;j++){
            a[i][j] = i+1
            document.write(a[i][j] + " ")
        }
    }
</script>

<h4>3</h4>
<script>
    a=[[],[],[]]

</script>
<h4>4</h4>
<script>
    a=[20,25,30,35,40,45]
    b=[]
    c=[]
    mid=a.length/2
    document.write("mid:",mid+ "<br>")
    for(i=0;i<mid;i++){
        b[i]=a[i]
    }

    for(i=mid;i<a.length;i++){
        c[i-mid]=a[i]
    }

    document.write("First array: "+b)
    document.write("<br>Second array: "+c)
</script>
<h4>5</h4>
<script>
    a=[1,2,3,4]

       }
        for(i=0;i<4;i++){

<h4>6</h4>

<script>
    a = [10, 70, 50, 30, 20]
    for(i=0; i<a.length; i++)
    {
        for(j=i+1; j<a.length; j++)
        {
            if(a[i] > a[j])
            {
                temp = a[i]
                a[i] = a[j]
                a[j] = temp
            }
        }
    }

    document.write("Ascending: " + a)
    for(i=0; i<a.length; i++)
    {
        for(j=i+1; j<a.length; j++)
        {
            if(a[i] < a[j])
            {
                temp = a[i]
                a[i] = a[j]
                a[j] = temp
            }
        }
    }

    document.write("<br>Descending: " + a)
</script>

<h4>7</h4>
<script>
    a=[1,6,7,8,2,3,4,2,2]
    count=0

    for(i=0;i<a.length;i++){
        if(a[i]==2){
            count++
        }
    }

    document.write("Occurrence of 2: "+count)
</script>
<h4>8</h4>
<script>
    a=[[1,2],[3,4]]
    b=[[5,6],[7,8]]
    c=[[],[]]

    for(i=0;i<2;i++){
        for(j=0;j<2;j++){
            c[i][j]=a[i][j]+b[i][j]
        }
    }

    for(i=0;i<2;i++){
        document.write("<br>")
        for(j=0;j<2;j++){
            document.write(c[i][j]+" ")
        }
    }
</script>

<body>
    <h4>natural numbers from 10 -50</h4>
    <script>
        sum=0
        n=0
        for(i=10;i<=50;i++){
            document.write(" ",i)
            sum=sum+i
            n++
            
        }
        avg=sum/n
        document.write("<br>sum:",sum)
        document.write("<br>average:",avg)
       
    </script>
    <h4>cube of numbers from 10-30</h4>
    <script>
        for(i=10;i<=30;i++){
            cube=i*i*i
            document.write("Cube of " + i + " = " + cube + "<br>")
        }
    </script>
    <h4>multiplication table</h4>
    <script>
        let n=4
        for(i=1;i<=10;i++){
            r=n * i    
            document.write( i + "*" + n + "=" + r +"<br>" )
        }
    </script>
    
<h4>revers of a number</h4>
<script>
        let num=153,reverse=0
        for( ;num>0;){
            r=num%10
            reverse = (reverse*10) +r
            num = Math.floor(num/10)
        }
        document.write("<br> The reversed number is: ",reverse)
</script>

<script>

</script>
<h4>palindrome</h4>
<script>
     n=121
     num=n
     reverse=0
     for( ;n>0; ){
        r = n % 10
        reverse = (reverse * 10) + r
        n = Math.floor(n / 10)
     }
     if(num==reverse){
        document.write("palindrome")
     }
     else{
        document.write("Not a palindrome")
     }
</script>

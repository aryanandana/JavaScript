<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>palindrome</h4>
    <script>
        str="malayalam"
        rev

    for(i=str.length-1; i>=0; i--)
    {
        rev = rev + str[i]
    }

    if(str == rev)
    {
        document.write("Palindrome")
    }
    else
    {
        document.write("Not a Palindrome")
    }
</script>
</body>
</html>

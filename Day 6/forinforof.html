<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For in</title>
</head>
<body>
    <h4>1.for in</h4>
    <script>
        a=[4,5,6,7]
        for(x in a){
            a[x]=a[x]*2
            document.write(a[x] + " ")
        }
    </script>
    <h4>2.for of</h4>
    <script>
        a=[4,5,6,7]
        sum=0
        for(x of a){
            sum=sum+x   
        }
         document.write("sum:",sum)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Varible let</title>
</head>
<body>
    <!-- let and const -->
    <script>
        let x
        x=10
        document.write("The value x is:" ,x)
        document.write (`THE value is ${x}`)
        document.write(" <br> The type of x is:",typeof(x))
    
        // String

        let y="Javascript"
        document.write(" <br> The value y is:" ,y)
        document.write (`<br>THE value is ${y}`)
        document.write(" <br> The type of y is:",typeof(y))

    
        let k="20"
        document.write("<br>The value k is:" ,k)
        document.write(" <br> The type of k is:",typeof(k))

        let t=true
        document.write("<br>The value t is:" ,t)
        document.write(" <br> The type of t is:",typeof(t))

        // object

        let person={
            name:'arya',
            age:"21",
            active:true

        }
        document.write("<br>The person is:",person.name)
        document.write("<br> The type is:",typeof(person))

        
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>
</head>
<body>
    <script>
        let a=5
        let b=10
        s=a=a+b
        document.write("The sum is:",s)

        let c="5"
        let d="10"
        e=c+d
         document.write(" <br>The sum is:",e)

        let n="arya"
        let l="nandana"
        f=n+l
        document.write("<br>name is:",f)

        // Typecasting

        // convert to integer
        let x="5"
        let y="10"
        r=Number(x)
        t=Number(y)
        q=r+t
         document.write(" <br>The sum is:",q)


        let ab=10
        let cd=20
        re=ab-cd
        document.write("<br> value:",re)

        let ef=10
        let gh=20
        rl=ef*gh
        document.write("<br> value:",rl)

        let ij=10
        let kl=20
        rel=ij/kl
        document.write("<br> value:",rel)

        let kx=20
        let mn=7
        relo=kx%mn
        document.write("<br> value:",relo)





    </script>
</body>
</html>

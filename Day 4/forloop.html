    <h4>pre-increment and post-increment</h4>
    <script>
        let k=0
        let j=k++
        document.write("the value after increment:",j)
        j=++k
        document.write("<br>the value after pre-increment",j)
        k++
        document.write("<br>k++:",k)
        ++k
        document.write("<br>++k:",k)
    </script>

<h4>palindrome</h4>
<script>
     n=121
     num=n
     reverse=0
     for( ;n>0; ){
        r = n % 10
        reverse = (reverse * 10) + r
        n = Math.floor(n / 10)
     }
     if(num==reverse){
        document.write("palindrome")
     }
     else{
        document.write("Not a palindrome")
     }
</script>
